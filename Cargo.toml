[workspace]
resolver = "3"
members = [
    "crates/msb-crd",
    "crates/msb-controller",
    "crates/msb-daemon",
    "crates/msb-prerunner",
    "crates/msb-bridge",
    "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["Super Rad Company <development@superrad.company>"]
repository = "https://github.com/superradcompany/msb-operator"
license = "Apache-2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
# kube ecosystem
kube = { version = "0.99", features = ["runtime", "derive", "client"] }
# Library crates must NOT enable a version feature — only binary crates do.
k8s-openapi = { version = "0.24", default-features = false }
schemars = "0.8"

# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors
thiserror = "2"
anyhow = "1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# cli
clap = { version = "4", features = ["derive"] }

# gRPC / protobuf (device plugin)
tonic = "0.12"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "8"
async-stream = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
