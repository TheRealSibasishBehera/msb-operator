[workspace]
resolver = "3"
members = [
    "crates/msb-crd",
    "crates/msb-controller",
    "crates/msb-daemon",
    "crates/msb-bridge",
    "crates/msb-gateway",
    "crates/msb-runtime",
    "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["Super Rad Company <development@superrad.company>"]
repository = "https://github.com/superradcompany/msb-operator"
license = "Apache-2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
# One upstream release; pin both exact and bump together.
microsandbox = { version = "=0.6.6", default-features = false }
microsandbox-types = "=0.6.6"

# kube ecosystem
kube = { version = "4.0", features = ["runtime", "derive", "client"] }
# Library crates must NOT enable a version feature — only binary crates do.
k8s-openapi = { version = "0.28", default-features = false }
schemars = "1.0"

# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors
thiserror = "2"
anyhow = "1"

# tracing
tracing = "0.1"
# Keep default features: `tracing-log` bridges `log`-emitting deps (e.g.
# kube-leader-election) into tracing. Do not add default-features = false.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# gRPC / protobuf (device plugin)
tonic = "0.12"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "8"
async-stream = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
