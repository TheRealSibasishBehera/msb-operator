apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Expiry always deletes the pod, even under Retain.
  - script: |
      for i in $(seq 1 15); do
        if ! kubectl get pod sandbox-e2e-expire-retain -n "$NAMESPACE" >/dev/null 2>&1; then
          echo "PASS: pod deleted on expiry"; exit 0
        fi
        sleep 2
      done
      echo "FAIL: pod still present after expiry"; exit 1
