apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Edit cpus/memory up to the reserved max on the running sandbox. Both are
  # mutable fields; the CEL rules accept cpus<=maxCpus and memory<=maxMemory.
  # The controller reconciles this over the bridge control socket (virtio
  # hotplug), no pod change.
  - script: |
      set -e
      kubectl patch sandbox e2e-resize -n "$NAMESPACE" --type=merge \
        -p '{"spec":{"cpus":2,"memory":1024}}'
      echo "PASS: patched spec.cpus=2 spec.memory=1024"
