apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Far-future deadline so boot never races expiry; a later step arms a short
  # deadline once Running is observed.
  - script: |
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: sandbox.microsandbox.dev/v1alpha1
      kind: Sandbox
      metadata:
        name: e2e-expire-delete
      spec:
        image: "alpine:3.20"
        cpus: 1
        memory: 512
        cmd: ["sleep", "3600"]
        runPolicy: Once
        lifecycle:
          shutdownTime: "2999-01-01T00:00:00Z"
          shutdownPolicy: Delete
      EOF
