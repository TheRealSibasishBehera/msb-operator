apiVersion: sandbox.microsandbox.dev/v1alpha1
kind: Sandbox
metadata:
  name: e2e-sec-missing
spec:
  image: "alpine:3.20"
  cpus: 1
  memory: 512
  cmd: ["sleep", "300"]
  ephemeral: true
  runPolicy: Once
  # References a Secret that does not exist. Fail-closed: the kubelet cannot mount
  # the missing Secret volume, so the pod never starts and the sandbox never runs.
  secrets:
    - env: API_KEY
      valueFrom:
        secretKeyRef:
          name: nonexistent-secret
          key: token
