apiVersion: sandbox.microsandbox.dev/v1alpha1
kind: Sandbox
metadata:
  name: e2e-boot
spec:
  # alpine:3.20 — a pre-baked cache image for this reference must exist on the
  # cluster (run.sh verifies). A cache miss makes the pod ImagePullBackOff.
  image: "alpine:3.20"
  cpus: 1
  memory: 512
  cmd: ["sleep", "600"]
  runPolicy: Once
