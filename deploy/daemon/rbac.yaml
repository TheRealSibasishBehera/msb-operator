apiVersion: v1
kind: ServiceAccount
metadata:
  name: msb-daemon
---
# Cluster-wide: RBAC cannot scope by the spec.nodeName field selector the daemon
# uses to narrow the watch to its own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: msb-daemon
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: msb-daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: msb-daemon
subjects:
  - kind: ServiceAccount
    name: msb-daemon
    namespace: msb-system
