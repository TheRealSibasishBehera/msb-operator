apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: msb-daemon
  namespace: microsandbox-system
spec:
  selector:
    matchLabels:
      app: msb-daemon
  template:
    metadata:
      labels:
        app: msb-daemon
    spec:
      priorityClassName: system-node-critical
      hostPID: false
      containers:
        - name: msb-daemon
          image: msb-daemon:latest
          command: ["msb-daemon", "device-plugin"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: device-plugin-dir
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev-dir
              mountPath: /dev
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            # Needs root to bind the device plugin socket under /var/lib/kubelet.
            # CAP_MKNOD not needed; only reads /dev/kvm.
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: device-plugin-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev-dir
          hostPath:
            path: /dev
            type: Directory
      tolerations:
        - operator: Exists
