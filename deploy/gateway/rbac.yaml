apiVersion: v1
kind: ServiceAccount
metadata:
  name: msb-gateway
---
# The gateway verifies the caller via tokenreviews/subjectaccessreviews, then
# acts on the sandbox with its own credentials. No Secret RBAC: the kubelet
# mounts Secrets, the gateway never reads them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: msb-gateway
rules:
  - apiGroups: ["sandbox.microsandbox.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: msb-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: msb-gateway
subjects:
  - kind: ServiceAccount
    name: msb-gateway
    namespace: msb-system
