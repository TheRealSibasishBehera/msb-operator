{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "msb-operator.daemon.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# The daemon watches sandbox pods scheduled to its own node to pre-pull their
# images. Read-only on pods, cluster-wide (the field selector narrows to the node
# at request time, but RBAC cannot scope by field selector).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "msb-operator.daemon.serviceAccountName" . }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "msb-operator.daemon.serviceAccountName" . }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "msb-operator.daemon.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "msb-operator.daemon.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
