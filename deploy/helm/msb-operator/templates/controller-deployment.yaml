{{- $reg := .Values.registry -}}
{{- $ver := .Chart.AppVersion -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msb-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "msb-operator.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "msb-operator.controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "msb-operator.controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: msb-controller
          image: {{ include "msb-operator.image" (dict "registry" $reg "repo" .Values.controller.image "tag" .Values.controller.tag "defaultTag" $ver) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--namespace", "$(MSB_NAMESPACE)"]
          env:
            - name: MSB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MSB_HOME
              value: {{ .Values.msbHome | quote }}
            - name: MSB_BRIDGE_PORT
              value: {{ .Values.bridgePort | quote }}
            - name: MSB_LEASE_TTL_SECS
              value: {{ .Values.controller.leaseTtlSeconds | quote }}
            - name: MSB_RUNTIME_IMAGE
              value: {{ include "msb-operator.image" (dict "registry" $reg "repo" .Values.sandbox.runtimeImage "tag" .Values.sandbox.runtimeTag "defaultTag" $ver) }}
            - name: MSB_BRIDGE_IMAGE
              value: {{ include "msb-operator.image" (dict "registry" $reg "repo" .Values.sandbox.bridgeImage "tag" .Values.sandbox.bridgeTag "defaultTag" $ver) }}
            - name: MSB_RUNTIME_LOG
              value: {{ .Values.sandbox.runtimeLog | quote }}
            - name: RUST_LOG
              value: {{ .Values.controller.logLevel | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
