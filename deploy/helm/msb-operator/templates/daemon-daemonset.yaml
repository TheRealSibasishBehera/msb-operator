{{- $reg := .Values.registry -}}
{{- $ver := .Chart.AppVersion -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: msb-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "msb-operator.daemon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "msb-operator.daemon.selectorLabels" . | nindent 8 }}
    spec:
      priorityClassName: system-node-critical
      hostPID: false
      serviceAccountName: {{ include "msb-operator.daemon.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: msb-daemon
          image: {{ include "msb-operator.image" (dict "registry" $reg "repo" .Values.daemon.image "tag" .Values.daemon.tag "defaultTag" $ver) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["msb-daemon", "device-plugin", "--kvm-path", {{ .Values.daemon.kvmPath | quote }}]
          env:
            - name: RUST_LOG
              value: {{ .Values.daemon.logLevel | quote }}
            # The node-scoped pod watch field-selects on spec.nodeName == this.
            - name: MSB_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MSB_CACHE_HOST_PATH
              value: {{ .Values.daemon.cacheHostPath | quote }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            - name: device-plugin-dir
              mountPath: /var/lib/kubelet/device-plugins
            # Only /dev/kvm is needed. Mounting the whole /dev read-only blocks
            # kubelet from creating /dev/termination-log inside the container.
            - name: kvm
              mountPath: {{ .Values.daemon.kvmPath | quote }}
            # msb pull runs with MSB_HOME=/msb; the host cache dir is mounted at
            # /msb/cache so writes land in the cache the daemon injects into pods.
            - name: msb-home
              mountPath: /msb
            - name: cache
              mountPath: /msb/cache
          securityContext:
            allowPrivilegeEscalation: false
            # msb pull writes to /msb (mounted volumes), never the container rootfs.
            readOnlyRootFilesystem: true
            # Root binds the device-plugin socket under /var/lib/kubelet; FOWNER
            # lets it chmod o+rw /dev/kvm so non-root sandbox pods can open it.
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["FOWNER"]
      volumes:
        - name: device-plugin-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: kvm
          hostPath:
            path: {{ .Values.daemon.kvmPath | quote }}
            type: CharDevice
        # Per-node MSB_HOME scratch (db/, run/); the cache lives under it on the host.
        - name: msb-home
          emptyDir: {}
        - name: cache
          hostPath:
            path: {{ .Values.daemon.cacheHostPath | quote }}
            type: DirectoryOrCreate
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
