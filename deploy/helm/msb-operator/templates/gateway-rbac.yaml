{{- if and .Values.gateway.enabled .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "msb-operator.gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# Gateway permissions. Two layers:
#   (a) create tokenreviews + subjectaccessreviews — to authenticate AND authorize
#       the CALLER (SAR checks whether the caller may do X).
#   (b) sandbox verbs the gateway itself PERFORMS on the caller's behalf — the
#       gateway is trusted middleware: it verifies the caller via SAR, then acts
#       with its own credentials. Both are required; SAR alone does not let it act.
# NO secrets RBAC (the kubelet mounts secrets; the gateway never reads them).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "msb-operator.gateway.serviceAccountName" . }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
rules:
  # (b) lifecycle + exec-resolve: create/get/list/delete sandboxes.
  - apiGroups: ["sandbox.microsandbox.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "create", "delete"]
  # (a) authenticate the caller's Bearer token.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # (a) authorize the caller's per-route verb.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "msb-operator.gateway.serviceAccountName" . }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "msb-operator.gateway.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "msb-operator.gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
