{{- if .Values.gateway.enabled }}
{{- $reg := .Values.registry -}}
{{- $ver := .Chart.AppVersion -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msb-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msb-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "msb-operator.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "msb-operator.gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "msb-operator.gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: msb-gateway
          image: {{ include "msb-operator.image" (dict "registry" $reg "repo" .Values.gateway.image "tag" .Values.gateway.tag "defaultTag" $ver) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--port", "$(MSB_GATEWAY_PORT)"]
          env:
            # Namespace is derived from the caller's token (R1), not configured.
            - name: MSB_GATEWAY_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: MSB_GATEWAY_CREATE_TIMEOUT_SECS
              value: {{ .Values.gateway.createTimeoutSecs | quote }}
            - name: MSB_GATEWAY_MAX_SESSIONS_PER_IDENTITY
              value: {{ .Values.gateway.maxSessionsPerIdentity | quote }}
            - name: MSB_GATEWAY_MAX_FRAME_BYTES
              value: {{ .Values.gateway.maxFrameBytes | int64 | quote }}
            - name: MSB_GATEWAY_MAX_SESSION_SECS
              value: {{ .Values.gateway.maxSessionSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
