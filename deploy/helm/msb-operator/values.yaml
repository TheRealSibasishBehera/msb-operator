# Default values for msb-operator.

# -- Container registry for all operator and sandbox-workload images.
registry: ghcr.io/superradcompany

# -- Image pull policy applied to the controller and daemon.
imagePullPolicy: IfNotPresent

# -- Image pull secrets, referenced by name, for a private registry.
imagePullSecrets: []

# GID of /dev/kvm on the nodes. REQUIRED and node-dependent: Ubuntu 24.04
# assigns it dynamically, so there is no safe default. Find it with
# `stat -c '%g' /dev/kvm` on a node, and pin it with a udev rule
# (KERNEL=="kvm", GROUP="kvm", MODE="0660") so it is stable across reboots.
# -- GID of /dev/kvm on the nodes (required; `helm install --set kvmGid=<gid>`).
kvmGid: ""

# msb home inside sandbox pods. Must be /msb: the cache's baked VMDK holds
# absolute paths under /msb/cache, so build and runtime must match.
# -- msb home path inside sandbox pods (must be /msb).
msbHome: /msb

# -- TCP port the bridge sidecar and its per-sandbox Service listen on.
bridgePort: 7000

controller:
  # -- Controller image repository (appended to `registry`).
  image: msb-controller
  # -- Controller image tag (defaults to the chart appVersion).
  tag: ""
  # -- Replicas. Two gives one active reconciler and one warm standby (leader election).
  replicas: 2
  # -- Leader-election lease lifetime, seconds. A standby acquires after this elapses without a renewal.
  leaseTtlSeconds: 15
  # -- Controller log level (RUST_LOG).
  logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

daemon:
  # -- Device-plugin daemon image repository (appended to `registry`).
  image: msb-daemon
  # -- Device-plugin daemon image tag (defaults to the chart appVersion).
  tag: ""
  # -- Path to the KVM device node the daemon watches.
  kvmPath: /dev/kvm
  # -- Host dir the daemon pulls images into and injects read-only into sandboxes.
  cacheHostPath: /var/lib/msb/cache
  # -- Daemon log level (RUST_LOG).
  logLevel: info
  # Sized for `msb pull` conversion (tar ingest + EROFS/VMDK build), not the old
  # device-plugin-only footprint.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Runs on every KVM-capable node; tolerate everything by default.
  # -- Daemon scheduling tolerations (defaults to tolerate all taints).
  tolerations:
    - operator: Exists
  # -- Restrict the daemon to nodes matching these labels (e.g. a kvm=true label).
  nodeSelector: {}

# The SDK-compatible gateway: impersonates the upstream CloudBackend so the
# UNMODIFIED microsandbox SDK (MSB_API_URL=<gateway>, MSB_API_KEY=<k8s token>)
# drives the cluster. Opt-in; off by default. Ships a ClusterIP Service only
# (in-cluster + `kubectl port-forward`, zero exposure; external users add their own
# Ingress).
gateway:
  # -- Deploy the SDK-compatible gateway (opt-in; off by default).
  enabled: false
  # -- Gateway image repository (appended to `registry`).
  image: msb-gateway
  # -- Gateway image tag (defaults to the chart appVersion).
  tag: ""
  # -- Replicas. Stateless (all state is in the API server), so scale freely.
  replicas: 1
  # -- Namespace whose sandboxes the gateway serves. Empty = derive from the caller's token (recommended).
  namespace: ""
  # -- Port the gateway listens on (HTTP/WS).
  port: 8080
  # -- Max concurrent exec sessions per identity (0 = unlimited).
  maxSessionsPerIdentity: 16
  # -- Reject any single WS frame larger than this (bytes). Default 64 MiB (agent exec-setup frames can be tens of MiB).
  maxFrameBytes: 67108864
  # -- Hard ceiling on one exec session's wall-clock (seconds); backstop, NOT an idle timeout. 0 = none.
  maxSessionSecs: 0
  # -- Watch budget (seconds) for create-until-Running. MUST stay < the SDK's request timeout (default 30s).
  createTimeoutSecs: 25
  # -- Gateway log level (RUST_LOG).
  logLevel: info
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Sidecar and workload images the controller stamps onto sandbox pods. Their
# tags default to the chart appVersion; override to pin independently.
sandbox:
  runtimeImage: msb-runtime
  bridgeImage: msb-bridge
  runtimeTag: ""
  bridgeTag: ""
  # -- RUST_LOG for sandbox runtime containers (boot-phase debugging).
  runtimeLog: info

# Let the chart create its own namespace, labelled `enforce: privileged`. The
# daemon mounts hostPath (device-plugin socket + /dev/kvm), which both
# `restricted` and `baseline` forbid — only `privileged` permits it, same as
# KubeVirt and Virtink. Leave false when the namespace is pre-created — but then
# it must permit hostPath (privileged), or the daemon pod is rejected.
# -- Create the operator namespace with a privileged Pod Security label.
createNamespace: false

# Install the Sandbox CRD with the chart. Set false if the CRD is managed
# out-of-band (e.g. applied separately in a GitOps flow).
# -- Install the Sandbox CRD as part of the release.
installCRD: true

rbac:
  # -- Create the controller ClusterRole/Binding and ServiceAccount.
  create: true
  # -- Create the aggregated sandbox-operator / sandbox-viewer tenant ClusterRoles.
  aggregatedRoles: true
