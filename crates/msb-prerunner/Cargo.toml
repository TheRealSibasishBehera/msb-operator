[package]
name = "msb-prerunner"
description = "Init container — resolves secrets to the shared config volume."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
msb-crd = { path = "../msb-crd" }
# Binary crate: selects the k8s-openapi API version for the graph (msb-crd is a
# library and leaves it unset). The prerunner itself no longer calls the API.
k8s-openapi = { version = "0.28", features = ["v1_32"], default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

[[bin]]
name = "msb-prerunner"
path = "src/main.rs"
